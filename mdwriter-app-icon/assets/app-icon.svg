<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: warm terracotta brand tones -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d47250"/>
      <stop offset="50%" stop-color="#c96442"/>
      <stop offset="100%" stop-color="#a84e28"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="innerGlow" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </radialGradient>
    <!-- Paper/document gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf6"/>
      <stop offset="100%" stop-color="#f0ebe0"/>
    </linearGradient>
    <!-- Nib accent gradient -->
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f5"/>
      <stop offset="100%" stop-color="#e8e2d4"/>
    </linearGradient>
    <!-- Subtle bottom edge shadow/depth -->
    <linearGradient id="edgeShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Shadow for document depth -->
    <filter id="docShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3d2010" flood-opacity="0.25"/>
    </filter>
    <!-- Clip for rounded superellipse corners -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- App icon shape: superellipse-style rounded square -->
  <g clip-path="url(#iconClip)">
    <!-- Background fill -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bgGrad)"/>
    <!-- Inner light/gloss overlay for dimensionality -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#innerGlow)"/>

    <!-- Decorative subtle paper texture specks -->
    <g opacity="0.05" fill="#ffffff">
      <circle cx="120" cy="180" r="3"/>
      <circle cx="880" cy="140" r="2.5"/>
      <circle cx="160" cy="820" r="2"/>
      <circle cx="900" cy="780" r="3"/>
      <circle cx="80" cy="500" r="2"/>
      <circle cx="940" cy="460" r="2.5"/>
      <circle cx="300" cy="90" r="1.8"/>
      <circle cx="700" cy="920" r="2.2"/>
    </g>

    <!-- Central document + fountain pen composition (scaled up for prominence) -->
    <g transform="translate(528, 548) scale(1.93)" filter="url(#docShadow)">
      <!-- Document/paper shape (slightly rotated for natural feel) -->
      <g transform="translate(-180, -200) rotate(-6)">
        <!-- Paper body with folded corner -->
        <path d="M0,40 L0,320 Q0,350 30,350 L220,350 Q250,350 250,320 L250,90 L190,30 L30,30 Q0,30 0,40 Z"
              fill="url(#paperGrad)" stroke="#ddd5c4" stroke-width="2"/>
        <!-- Folded corner triangle -->
        <path d="M190,30 L190,90 L250,90 Z" fill="#e8e2d4" stroke="#ddd5c4" stroke-width="2"/>
        <path d="M190,30 L250,90" stroke="#d0c8b5" stroke-width="1.5" fill="none"/>

        <!-- Markdown content: H1 heading (thick terracotta bar) -->
        <rect x="36" y="110" width="150" height="12" rx="4" fill="#c96442" opacity="0.85"/>
        <!-- H2 subheading -->
        <rect x="36" y="142" width="100" height="8" rx="4" fill="#753a22" opacity="0.5"/>
        <!-- Body text lines -->
        <rect x="36" y="178" width="178" height="6" rx="3" fill="#8a887e" opacity="0.4"/>
        <rect x="36" y="198" width="160" height="6" rx="3" fill="#8a887e" opacity="0.35"/>
        <rect x="36" y="218" width="170" height="6" rx="3" fill="#8a887e" opacity="0.35"/>
        <!-- Blockquote / code accent bar -->
        <rect x="36" y="242" width="4" height="48" rx="2" fill="#c96442" opacity="0.6"/>
        <rect x="48" y="250" width="120" height="5" rx="2.5" fill="#8a887e" opacity="0.3"/>
        <rect x="48" y="268" width="100" height="5" rx="2.5" fill="#8a887e" opacity="0.28"/>
        <rect x="48" y="286" width="110" height="5" rx="2.5" fill="#8a887e" opacity="0.28"/>
        <!-- Final short line -->
        <rect x="36" y="316" width="80" height="6" rx="3" fill="#8a887e" opacity="0.3"/>
      </g>

      <!-- Fountain pen resting across document -->
      <g transform="translate(80, -80) rotate(25)">
        <!-- Pen barrel -->
        <rect x="-18" y="-180" width="36" height="200" rx="10" fill="#faf9f5" opacity="0.95"/>
        <!-- Grip section -->
        <rect x="-20" y="20" width="40" height="50" rx="8" fill="#e8e2d4"/>
        <!-- Metal center ring -->
        <rect x="-22" y="12" width="44" height="10" rx="3" fill="#b4b2a7"/>
        <!-- Nib (pen tip) -->
        <path d="M-16,70 L0,140 L16,70 Z" fill="url(#nibGrad)" stroke="#cdcabf" stroke-width="1.5"/>
        <!-- Nib slit -->
        <line x1="0" y1="80" x2="0" y2="132" stroke="#9b988c" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Nib breather hole -->
        <circle cx="0" cy="100" r="4" fill="#9b988c" opacity="0.6"/>
        <!-- Pocket clip -->
        <path d="M14,-170 Q30,-160 28,-120 L22,-80 Q20,-70 14,-70" fill="none" stroke="#e8e2d4" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Bottom edge shadow for icon depth -->
    <rect x="0" y="920" width="1024" height="104" fill="url(#edgeShadow)" opacity="0.2"/>
  </g>

  <!-- Outer subtle border for crispness at small sizes -->
  <rect x="1" y="1" width="1022" height="1022" rx="223" ry="223"
        fill="none" stroke="#000000" stroke-width="2" opacity="0.1"/>
</svg>
